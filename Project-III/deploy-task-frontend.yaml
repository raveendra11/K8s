apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: deploy-task-frontend
  name: deploy-task-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: task-frontend
  strategy: {}
  template:
    metadata:
      labels:
        app: task-frontend
    spec:
      containers:
      - image: bhabanisn/task-frontend
        name: task-frontend-con
        env:
          - name: BACKEND_SERVICE_DNS
            value: task-backend-clusterip-svc.default.svc.cluster.local 
          - name: BACKEND_SERVICE_PORT
            value: "8082"
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
